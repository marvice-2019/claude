# Deploys dots/ (static, no build step) to dots.marvice.tech on Hostinger via FTP.
# GitHub Pages can't be used here: this repo's Pages site already serves agency.marvice.tech,
# and Pages allows one custom domain per repo.
#
# One-time setup:
#   1. hPanel → Websites → marvice.tech → Domains → Subdomains: create "dots".
#      Hostinger adds the DNS record and issues SSL automatically.
#   2. hPanel → Files → FTP Accounts: create an FTP account whose directory is the
#      subdomain's folder (e.g. public_html/dots).
#   3. Repo → Settings → Secrets and variables → Actions → add secrets:
#        DOTS_FTP_HOST      FTP hostname/IP shown in hPanel
#        DOTS_FTP_USER      FTP username
#        DOTS_FTP_PASSWORD  FTP password
#      Optional variable DOTS_FTP_DIR (default "/") if the FTP account isn't rooted at the subdomain folder.

name: Deploy dots.marvice.tech

on:
  push:
    branches: [main]
    paths:
      - "dots/**"
      - ".github/workflows/deploy-dots.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dots
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOMAIN: dots.marvice.tech

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: dots-marvice-tech
      url: https://dots.marvice.tech/
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check site
        run: |
          test -f dots/index.html
          test -f dots/style.css
          if grep -n 'munderdiffl\.in' dots/*.html; then
            echo "::error::Upstream marketing domain referenced in dots/"; exit 1
          fi

      - name: Check secrets
        env:
          HOST: ${{ secrets.DOTS_FTP_HOST }}
          USER: ${{ secrets.DOTS_FTP_USER }}
          PASS: ${{ secrets.DOTS_FTP_PASSWORD }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing DOTS_FTP_HOST"
          [ -n "$USER" ] || missing="$missing DOTS_FTP_USER"
          [ -n "$PASS" ] || missing="$missing DOTS_FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing (see setup notes at the top of this workflow)"; exit 1
          fi

      - name: Upload via FTP
        env:
          HOST: ${{ secrets.DOTS_FTP_HOST }}
          USER: ${{ secrets.DOTS_FTP_USER }}
          PASS: ${{ secrets.DOTS_FTP_PASSWORD }}
          REMOTE_DIR: ${{ vars.DOTS_FTP_DIR || '/' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # README is repo docs, not site content. --delete removes files dropped from dots/.
          lftp -u "$USER","$PASS" "$HOST" <<LFTP
          set ftp:ssl-allow yes
          set net:max-retries 3
          set net:timeout 30
          mirror --reverse --delete --verbose --exclude-glob README.md dots/ "$REMOTE_DIR"
          bye
          LFTP

      - name: Smoke test
        run: |
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN/")
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::https://$DOMAIN/ not returning 200. Check the subdomain exists in hPanel and SSL is issued."
          exit 1
