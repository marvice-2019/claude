# Redeploys dots.marvice.tech on push. The site is a Coolify app on the Marvice VPS
# (srv1373084, "Ubuntu 24.04 with Coolify"): Coolify builds dots/ from this public repo
# and its proxy handles SSL, so there's no SSH or server setup here.
#
# One-time, in https://coolify.marvice.tech:
#   + New → Public Repository → https://github.com/marvice-2019/claude, branch main
#   Build Pack: Static · Base Directory: /dots · Domain: https://dots.marvice.tech → Deploy
#
# Then, for auto-deploy on push, add under repo Settings → Secrets and variables → Actions:
#   secret   COOLIFY_TOKEN      Coolify → Keys & Tokens → API tokens (needs "deploy")
#   variable COOLIFY_DOTS_UUID  dh9v5njamfpihoja5ddmyohl (the dots app)
# Without them this job only warns; redeploy from Coolify by hand.

name: Deploy dots.marvice.tech

on:
  push:
    branches: [main]
    paths:
      - "dots/**"
      - ".github/workflows/deploy-dots.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dots
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOMAIN: dots.marvice.tech
  COOLIFY_URL: https://coolify.marvice.tech

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check site
        run: |
          test -f dots/index.html
          test -f dots/style.css
          if grep -n 'munderdiffl\.in' dots/*.html; then
            echo "::error::Upstream marketing domain referenced in dots/"; exit 1
          fi

      - name: Trigger Coolify deploy
        id: deploy
        env:
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUID: ${{ vars.COOLIFY_DOTS_UUID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$UUID" ]; then
            echo "::warning::COOLIFY_TOKEN / COOLIFY_DOTS_UUID not set; skipping auto-deploy. Redeploy in Coolify, or see the top of this workflow."
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Coolify 4.3+ only accepts POST here (GET returns "This endpoint has changed to a POST request").
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" "$COOLIFY_URL/api/v1/deploy?uuid=$UUID&force=false"
          echo "triggered=true" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.deploy.outputs.triggered == 'true'
        run: |
          # Static builds take ~30-60s in Coolify.
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN/")
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::https://$DOMAIN/ not returning 200. Check the deployment log in Coolify."
          exit 1
