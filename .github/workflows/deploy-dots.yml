# Deploys dots/ (static, no build step) to dots.marvice.tech on the Marvice VPS
# (srv1373084.hstgr.cloud, the Docker + Traefik box that also runs n8n) via rsync over SSH.
# An nginx container behind the existing Traefik serves /var/www/dots.marvice.tech; Traefik handles SSL.
# GitHub Pages can't host it: this repo's Pages site already serves agency.marvice.tech.
#
# One-time setup on the VPS, as root (hPanel → VPS → Browser terminal works):
#   curl -fsSL https://raw.githubusercontent.com/marvice-2019/claude/main/scripts/vps-setup-dots.sh | bash
# It prints the secrets below.
#
# DNS (Hostinger → Domains → marvice.tech → DNS records):  A  dots  →  91.108.110.216
# Repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS. Optional variable: VPS_PORT.

name: Deploy dots.marvice.tech

on:
  push:
    branches: [main]
    paths:
      - "dots/**"
      - ".github/workflows/deploy-dots.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dots
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOMAIN: dots.marvice.tech

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: dots-marvice-tech
      url: https://dots.marvice.tech/
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check site
        run: |
          test -f dots/index.html
          test -f dots/style.css
          if grep -n 'munderdiffl\.in' dots/*.html; then
            echo "::error::Upstream marketing domain referenced in dots/"; exit 1
          fi

      - name: Configure SSH
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing VPS_HOST"
          [ -n "$USER" ] || missing="$missing VPS_USER"
          [ -n "$KEY" ] || missing="$missing VPS_SSH_KEY"
          [ -n "$KNOWN_HOSTS" ] || missing="$missing VPS_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing (run scripts/vps-setup-dots.sh on the VPS; see top of this workflow)"; exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Rsync to VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          # README is repo docs, not site content. --delete removes files dropped from dots/.
          rsync -az --delete --exclude README.md \
            --chmod=D755,F644 \
            -e "ssh -p $PORT -o StrictHostKeyChecking=yes" \
            dots/ "$USER@$HOST:/var/www/$DOMAIN/"

      - name: Smoke test
        run: |
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN/")
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Files are on the VPS, but https://$DOMAIN/ isn't returning 200. Check the dots A record points at the VPS and the container is up: docker ps --filter name=dots-marvice-tech"
          exit 1
