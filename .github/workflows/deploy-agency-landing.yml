# Deploys agency-agents-app/landing (static, no build step) to agency.marvice.tech
# on a VPS (nginx) over rsync+SSH.
#
# One-time server setup: scripts/vps-setup-agency.sh (prints the values below).
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST          VPS public IP or hostname
#   VPS_USER          deploy user (default from the setup script: "deploy")
#   VPS_SSH_KEY       private key printed by the setup script
#   VPS_KNOWN_HOSTS   host key line printed by the setup script (pins the server)
# Optional repo variable:
#   VPS_PORT          SSH port, default 22

name: Deploy agency.marvice.tech

on:
  push:
    branches: [main]
    paths:
      - "agency-agents-app/landing/**"
      - ".github/workflows/deploy-agency-landing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-agency-landing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: agency-marvice-tech
      url: https://agency.marvice.tech/
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check landing
        run: |
          test -f agency-agents-app/landing/index.html
          if grep -rn 'agencyagents\.app' agency-agents-app/landing --include='*.html' --include='*.xml' --include='*.txt'; then
            echo "::error::Upstream domain still referenced in landing files"; exit 1
          fi

      - name: Check deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing VPS_HOST"
          [ -n "$VPS_USER" ] || missing="$missing VPS_USER"
          [ -n "$VPS_SSH_KEY" ] || missing="$missing VPS_SSH_KEY"
          [ -n "$VPS_KNOWN_HOSTS" ] || missing="$missing VPS_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing. Run scripts/vps-setup-agency.sh on the VPS to get them. Nothing was deployed."
            exit 1
          fi

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Upload via rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          # --delete keeps the web root in sync; P(rotect) keeps files placed by hand.
          rsync -rlptz --delete --chmod=D755,F644 \
            --exclude='.htaccess' --exclude='README.md' --exclude='.git*' \
            --filter='P updater.json' \
            -e "ssh -i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $VPS_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            agency-agents-app/landing/ "$VPS_USER@$VPS_HOST:/var/www/agency.marvice.tech/"

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --retry-all-errors https://agency.marvice.tech/)
          echo "HTTP $code"
          test "$code" = "200"
