# Deploys agency-agents-app/landing (static, no build step) to agency.marvice.tech
# via GitHub Pages: the folder is published to the gh-pages branch, which Pages serves.
#
# One-time DNS (Hostinger → Domains → marvice.tech → DNS records):
#   CNAME  agency  →  marvice-2019.github.io
# No secrets needed; the job pushes with the built-in GITHUB_TOKEN.
#
# scripts/vps-setup-agency.sh is kept for moving the site to a VPS later.

name: Deploy agency.marvice.tech

on:
  push:
    branches: [main]
    paths:
      - "agency-agents-app/landing/**"
      - ".github/workflows/deploy-agency-landing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-agency-landing
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOMAIN: agency.marvice.tech

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: agency-marvice-tech
      url: https://agency.marvice.tech/
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check landing
        run: |
          test -f agency-agents-app/landing/index.html
          if grep -rn 'agencyagents\.app' agency-agents-app/landing --include='*.html' --include='*.xml' --include='*.txt'; then
            echo "::error::Upstream domain still referenced in landing files"; exit 1
          fi

      - name: Build site
        run: |
          mkdir _site
          # .htaccess is Apache-only and README is docs; Pages needs neither.
          rsync -a --exclude='.htaccess' --exclude='README.md' agency-agents-app/landing/ _site/
          echo "$DOMAIN" > _site/CNAME
          touch _site/.nojekyll

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish $DOMAIN from ${GITHUB_SHA::7}"
          # gh-pages is a build output: one commit, replaced on every deploy.
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Check DNS
        run: |
          want="${GITHUB_REPOSITORY_OWNER,,}.github.io"
          target=$(dig +short CNAME "$DOMAIN" | sed 's/\.$//')
          if [ "$target" != "$want" ]; then
            echo "::error::$DOMAIN CNAME is '${target:-missing}'. Published to gh-pages, but the domain won't load until DNS has: CNAME agency → $want"
            exit 1
          fi

      - name: Smoke test
        run: |
          # Pages takes ~1 min to rebuild after the push.
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN/")
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1
